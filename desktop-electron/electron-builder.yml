# electron-builder 打包配置（阶段 10）。
#
# 分工：
#   1. scripts/Publish-Portable.ps1 -Target desktop  → publish/desktop（.NET API 本体）
#   2. 本文件                                        → publish/releases（NSIS 安装包）
#
# 壳只打包 main.js / preload.js / package.json；后端整份目录通过 extraResources
# 原样放到 <安装目录>\resources\api，由 main.js 的 process.resourcesPath/api 拉起，
# 因此后端文件不会被塞进 asar（asar 里的 exe 无法直接启动）。
#
# 命名分两层，别混了：
#   productName    = 「用户看到的名字」：控制面板卸载项、开始菜单、窗口标题、安装包文件名
#   executableName = 「磁盘上的名字」：%LOCALAPPDATA%\Programs\<executableName>\<executableName>.exe
# 路径用 ASCII、显示名用中文，是为了既让人一眼认出是什么软件，又不给中文路径的
# 兼容性风险（国内安全软件 / 解压工具 / 第三方安装器对中文路径的支持并不一致）。
#
# appId 绝对不能动：NSIS 的升级判定靠 HKCU\Software\<UUID(appId)> 里的 InstallLocation，
# 改了就等于换了个产品，老用户永远收不到升级。
appId: com.myfirstmafagent.desktop
productName: 知间-本地知识库
executableName: Zhijian
copyright: Copyright © 2026 知间

directories:
  output: ../publish/releases
  buildResources: build

files:
  - main.js
  - preload.js
  - updater.js
  - splash.html
  # 可选：用户放一张 splash.gif 就能换成自己的启动动画（没有也不影响）。
  - splash.gif
  - package.json

extraResources:
  - from: ../publish/desktop
    to: api

asar: true

# 自动更新发布源（P0-3）。
#
# 默认指向本项目的 GitHub Releases：electron-builder 会生成 latest.yml 并把
# provider 信息写进 resources/app-update.yml，安装后的客户端直接查这个源。
#
# 运行时优先级（见 updater.js）：
#   1. 环境变量 MAF_UPDATE_URL
#   2. 用户数据目录 update-feed.json 里的 { "url": "..." }
#   3. 本文件里的默认值（下面的 GitHub 仓库）
# 因此同一个安装包可以指向 GitHub Releases、自建静态目录或内网发布点。
#
# 说明：GitHub 源不需要 gh CLI，发布动作由 scripts/Publish-Release.ps1 调
# REST API 完成（令牌从 git credential 里取，见该脚本注释）。
publish:
  provider: github
  owner: 1Oldcoin
  repo: KnowSpace
  releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../assets/app.ico
  # 产物名用 ASCII，**不要**写 ${productName}。
  # 原因（实测过）：productName 含中文时，electron-builder 会为 GitHub 发布源把
  # latest.yml 里的 path/url 换成 computeSafeArtifactName() 的结果（退化成
  # `${name}-setup-${version}.exe`），而磁盘上的文件名仍是中文——两边对不上，
  # 自动更新就会 404。显示名要中文，文件名要 ASCII，两边各取所需。
  artifactName: Zhijian-${version}-${arch}-setup.${ext}
nsis:
  # 交互式安装向导（不用 oneClick）：用户可改安装目录、能看到进度。
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 知间
  # 卸载/升级前先停便携数据库，否则 postgres.exe 会锁住安装目录。
  include: build/installer.nsh
  # 用户数据在 %LOCALAPPDATA%\MyFirstMafAgentData，绝不能随卸载删除。
  deleteAppDataOnUninstall: false
  artifactName: Zhijian-${version}-setup.${ext}
